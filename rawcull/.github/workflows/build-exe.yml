name: build rawcull.exe
on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    tags: ["v*"]              # git tag v0.2.0 && git push --tags  -> GitHub Release with the .exe

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Test
        run: |
          pip install -e ".[test]"
          pytest -q -rs
      - name: Build + self-test the exe
        run: powershell -ExecutionPolicy Bypass -File packaging\build_exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rawcull-exe
          path: dist/rawcull.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/rawcull.exe
